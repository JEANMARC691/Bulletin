name: Boletín semanal

on:
  schedule:
    # Cada sábado a las 03:00 UTC (05:00 en verano / 04:00 en invierno, hora de Madrid)
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      modo:
        description: "completa = rehacer toda la edición · solo_dossier = rehacer solo el dossier"
        type: choice
        options: [completa, solo_dossier, solo_maquetar]
        default: completa
      tema:
        description: "Tema del dossier (opcional)"
        type: string
        required: false
      instrucciones:
        description: "Instrucciones para Claude (opcional)"
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar la edición pendiente
        if: ${{ github.event.inputs.modo == 'solo_dossier' }}
        run: |
          RAMA=$(gh pr list --state open --json headRefName,createdAt \
                 -q '[.[] | select(.headRefName | startswith("edicion-"))] | sort_by(.createdAt) | last | .headRefName // empty')
          if [ -z "$RAMA" ]; then echo "No hay ninguna edición pendiente de aprobar."; exit 0; fi
          git fetch origin "$RAMA"
          F=$(git ls-tree --name-only "origin/$RAMA" data/ | grep '^data/edicion-' | sort | tail -1)
          git show "origin/$RAMA:$F" > data/previa.json
          echo "Edición recuperada de $RAMA ($F)"

      - name: Investigar y redactar la edición
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODO: ${{ github.event.inputs.modo || 'completa' }}
          TEMA_MANUAL: ${{ github.event.inputs.tema }}
          INSTRUCCIONES: ${{ github.event.inputs.instrucciones }}
        run: python scripts/generar.py

      - name: Preparar la edición para aprobación
        id: pr
        run: |
          export RAMA="edicion-${{ steps.gen.outputs.fecha }}-$(date +%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RAMA"
          git add site data tema.txt
          git commit -m "Bulletin Rilamax N.º ${{ steps.gen.outputs.numero }} (semana ${{ steps.gen.outputs.semana }})"
          git push origin "$RAMA"
          URL=$(gh pr create --base main --head "$RAMA" \
                --title "Bulletin Rilamax N.º ${{ steps.gen.outputs.numero }} — semana ${{ steps.gen.outputs.semana }}" \
                --body-file out/pr_body.md)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for N in $(gh pr list --state open --json number,headRefName \
                     -q '.[] | select(.headRefName | startswith("edicion-")) | select(.headRefName != $ENV.RAMA) | .number'); do
            gh pr close "$N" --delete-branch --comment "Sustituida por una nueva versión." || true
          done

      - name: Enviar correo de revisión
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: python scripts/enviar_correo.py

      - name: Avisar del error por correo
        if: failure()
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/enviar_correo.py --error
