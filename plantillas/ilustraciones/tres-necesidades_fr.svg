<figure class="illus" aria-label="Les trois grands besoins d'énergie d'un pays. L'électricité n'en couvre qu'environ un quart.">
<svg viewBox="0 0 660 250" role="img" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:'Public Sans',system-ui,sans-serif">
<g>
 <rect x="6" y="10" width="200" height="190" rx="14" fill="var(--fr-soft)" stroke="var(--fr)" stroke-width="2.5"/>
 <g transform="translate(106,62)" fill="none" stroke="var(--fr)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-14 -22 v14 M14 -22 v14"/><path d="M-24 -8 h48 v10 a24 24 0 0 1 -48 0 z"/><path d="M0 26 v14"/>
 </g>
 <text x="106" y="138" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">Électricité</text>
 <text x="106" y="162" text-anchor="middle" font-size="12.5" fill="var(--muted)">Éclairage, appareils,</text>
 <text x="106" y="179" text-anchor="middle" font-size="12.5" fill="var(--muted)">une partie du chauffage</text>
</g>
<g>
 <rect x="230" y="10" width="200" height="190" rx="14" fill="var(--surface)" stroke="var(--rule)" stroke-width="2"/>
 <g transform="translate(330,62)" fill="none" stroke="var(--es)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-30 14 l8 -20 h44 l8 20 z"/><path d="M-34 14 h68 v12 h-68 z"/><circle cx="-20" cy="30" r="5"/><circle cx="20" cy="30" r="5"/>
  <path d="M8 -26 c4 6 8 10 8 15 a8 8 0 0 1 -16 0 c0 -5 4 -9 8 -15 z" />
 </g>
 <text x="330" y="138" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">Carburants</text>
 <text x="330" y="162" text-anchor="middle" font-size="12.5" fill="var(--muted)">Voitures, camions,</text>
 <text x="330" y="179" text-anchor="middle" font-size="12.5" fill="var(--muted)">avions, tracteurs</text>
</g>
<g>
 <rect x="454" y="10" width="200" height="190" rx="14" fill="var(--surface)" stroke="var(--rule)" stroke-width="2"/>
 <g transform="translate(554,62)" fill="none" stroke="var(--es)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M0 -30 c14 14 22 26 22 38 a22 22 0 0 1 -44 0 c0 -10 6 -18 12 -24 c0 8 4 13 8 15 c0 -10 0 -20 2 -29 z"/>
 </g>
 <text x="554" y="138" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)">Chaleur</text>
 <text x="554" y="162" text-anchor="middle" font-size="12.5" fill="var(--muted)">Chauffage au gaz ou au fioul,</text>
 <text x="554" y="179" text-anchor="middle" font-size="12.5" fill="var(--muted)">fours industriels</text>
</g>
<rect x="6" y="218" width="648" height="14" rx="7" fill="var(--rule)"/>
<rect x="6" y="218" width="162" height="14" rx="7" fill="var(--fr)"/>
<text x="176" y="230" font-size="12" font-weight="600" fill="var(--fr)">≈ 1/4</text>
</svg>
<figcaption>Les trois grands besoins d'énergie d'un pays. L'électricité n'en couvre qu'environ un quart.</figcaption>
</figure>
